name: EVChargeFlow CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Backend Dependencies
      working-directory: ./tactive-assessment/app/backend
      run: npm install

    - name: Run Backend Unit Tests (Vitest)
      working-directory: ./tactive-assessment/app/backend
      run: npm run test

    - name: Verify Allocation Engine Strict Coverage
      working-directory: ./tactive-assessment/app/backend
      run: npm run test:coverage

  build-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Frontend Dependencies
      working-directory: ./tactive-assessment/app/frontend
      run: npm install

    - name: Build Frontend
      working-directory: ./tactive-assessment/app/frontend
      run: npm run build
